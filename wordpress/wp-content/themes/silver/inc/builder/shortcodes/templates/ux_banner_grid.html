<div class="banner-grid-wrapper">
	<div id="banner-grid-{{:: shortcode.$id }}" class="banner-grid {{ shortcode.options.class }} {{ shortcode.options.visibility }}">
		<!-- Laid out by the CSS grid of .row-grid (silver.css), as on the front
		     end: cells span their width class and height (grid-col-1, 1-2...),
		     row units come from --grid-height. No Packery, no sizer element. -->
		<div class="row row-grid row-{{ shortcode.options.spacing }} row-{{ shortcode.options.width }}
			row-box-shadow-{{ shortcode.options.depth }}
			row-box-shadow-{{ shortcode.options.depthHover }}-hover">
			<content></content>
		</div>

		<style scope="scope">
		   #banner-grid-{{:: shortcode.$id }} { --grid-height: {{ shortcode.options.height * 1 }}px; }
		</style>
	</div>
</div>
